[build-system]
requires = ["setuptools>=68", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "qgemm"
dynamic = ["version"]
description = "INT8 fake-quant GEMM CUDA kernels with STE backward"
readme = "Readme.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "torch>=2.2"]

[project.urls]
Repository = "https://github.com/Askash1234567890/qgemm"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
